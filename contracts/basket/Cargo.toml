[package]
name = "darwin-basket"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
darwin-token = { path = "../token" }
darwin-oracle = { path = "../oracle" }
darwin-market = { path = "../market" }
